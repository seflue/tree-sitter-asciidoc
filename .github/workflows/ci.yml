name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: check regenerate parser
        run: |
          pnpm generate
          git diff --exit-code .

      - name: run test
        run: |
          pnpm test

      # tree-sitter fuzz exits 0 even when an edit breaks the tree.
      - name: check incremental parse of pinned cases
        working-directory: tree-sitter-asciidoc
        env:
          TREE_SITTER_SEED: 1
        run: |
          pnpm exec tree-sitter fuzz -i 'page break belongs to the next section' --iterations 5000 --edits 1 | tee fuzz.log
          ! grep -q 'Incorrect parse' fuzz.log
